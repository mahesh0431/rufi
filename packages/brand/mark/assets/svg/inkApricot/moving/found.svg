<svg xmlns="http://www.w3.org/2000/svg" class="rufi m-wide m-lift m-sign" viewBox="60 40 920 800" width="589" height="512" role="img" aria-label="Rufi"><style> .rufi .under { opacity: 0 } .rufi .back { opacity: 0 } .rufi .eye { transform-box: fill-box; transform-origin: center } .rufi .flapL { transform-box: fill-box; transform-origin: 100% 0; --a: 118.7deg } .rufi .flapR { transform-box: fill-box; transform-origin: 0 0; --a: 61.3deg } .rufi .all { transform-box: fill-box; transform-origin: 50% 60% } @keyframes rufi-blink { 0%, 93%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.08) } } @keyframes rufi-blink2 { 0%, 84%, 92%, 100% { transform: scaleY(1) } 87%, 95% { transform: scaleY(.08) } } @keyframes rufi-look { 0%, 25% { transform: translate(0, 0) } 35%, 60% { transform: translate(18px, -16px) } 70%, 100% { transform: translate(-16px, -16px) } } @keyframes rufi-read { 0%, 100% { transform: translate(-18px, 14px) } 50% { transform: translate(18px, 14px) } } @keyframes rufi-squeeze { 0%, 30%, 100% { transform: scaleY(1) } 45%, 75% { transform: scaleY(.42) } } @keyframes rufi-sleepy { 0%, 100% { transform: scaleY(1) } 40%, 58% { transform: scaleY(.3) } } @keyframes rufi-wide { 0%, 30%, 100% { transform: scale(1) } 45%, 80% { transform: scale(1.12) } } .rufi.m-blink .eye { animation: rufi-blink 4s infinite } .rufi.m-blink2 .eye { animation: rufi-blink2 4.4s infinite } .rufi.m-look .eye { animation: rufi-look 4s ease-in-out infinite } .rufi.m-read .eye { animation: rufi-read 1.8s ease-in-out infinite } .rufi.m-happy .eye { transform-origin: 50% 0; animation: rufi-squeeze 2.6s ease-in-out infinite } .rufi.m-wink .eye:nth-of-type(2) { transform-origin: 50% 0; animation: rufi-squeeze 2.4s ease-in-out infinite } .rufi.m-sleepy .eye { transform-origin: 50% 100%; animation: rufi-sleepy 4.2s ease-in-out infinite } .rufi.m-wide .eye { animation: rufi-wide 3s ease-in-out infinite } @keyframes rufi-fold { 0%, 50%, 100% { transform: rotate(var(--a)) scaleY(1) rotate(calc(-1 * var(--a))) } 72%, 78% { transform: rotate(var(--a)) scaleY(.06) rotate(calc(-1 * var(--a))) } } @keyframes rufi-flip { 0%, 30%, 100% { transform: rotate(var(--a)) scaleY(1) rotate(calc(-1 * var(--a))) } 55%, 75% { transform: rotate(var(--a)) scaleY(-1) rotate(calc(-1 * var(--a))) } } @keyframes rufi-front { 0%, 42%, 88%, 100% { opacity: 1 } 43%, 87% { opacity: 0 } } @keyframes rufi-backside { 0%, 42%, 88%, 100% { opacity: 0 } 43%, 87% { opacity: 1 } } @keyframes rufi-liftL { 0%, 40%, 100% { transform: rotate(0) } 55%, 80% { transform: rotate(16deg) } } @keyframes rufi-liftR { 0%, 40%, 100% { transform: rotate(0) } 55%, 80% { transform: rotate(-16deg) } } @keyframes rufi-twitch { 0%, 80%, 100% { transform: rotate(0) } 84% { transform: rotate(12deg) } 88% { transform: rotate(2deg) } 92% { transform: rotate(9deg) } 96% { transform: rotate(0) } } @keyframes rufi-typeL { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(12deg) } 50% { transform: rotate(0) } } @keyframes rufi-typeR { 0%, 50%, 100% { transform: rotate(0) } 75% { transform: rotate(-12deg) } } .rufi.m-fold .flapL, .rufi.m-fold .flapR { animation: rufi-fold 3.2s ease-in-out infinite } .rufi.m-wave .flapL { animation: rufi-fold 3.2s ease-in-out infinite } .rufi.m-wave .flapR { animation: rufi-fold 3.2s ease-in-out .5s infinite } .rufi.m-flip .flapL { animation: rufi-flip 3.6s ease-in-out infinite } .rufi.m-flip .flapL .front { animation: rufi-front 3.6s infinite } .rufi.m-flip .flapL .back { animation: rufi-backside 3.6s infinite } .rufi.m-lift .under, .rufi.m-twitch .under, .rufi.m-typing .under, .rufi.m-oneear .under, .rufi.m-curious .under { opacity: 1 } .rufi.m-lift .flapL { animation: rufi-liftL 3s ease-in-out infinite } .rufi.m-lift .flapR { animation: rufi-liftR 3s ease-in-out infinite } .rufi.m-twitch .flapL { animation: rufi-twitch 4s ease-in-out infinite } .rufi.m-typing .flapL { animation: rufi-typeL 1.2s ease-in-out infinite } .rufi.m-typing .flapR { animation: rufi-typeR 1.2s ease-in-out infinite } .rufi.m-oneear .flapR { transform: rotate(-16deg) } .rufi.m-curious .flapR { animation: rufi-liftR 3.4s ease-in-out infinite } .rufi.m-earsdown .flapL, .rufi.m-earsdown .flapR { transform: rotate(var(--a)) scaleY(.5) rotate(calc(-1 * var(--a))) } @keyframes rufi-hop { 0%, 100% { transform: translateY(0) } 30% { transform: translateY(-22px) } 50% { transform: translateY(0) } 65% { transform: translateY(-10px) } } @keyframes rufi-tilt { 0%, 30%, 100% { transform: rotate(0) } 45%, 80% { transform: rotate(-8deg) } } @keyframes rufi-breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.018) } } .rufi.m-breathe .all { animation: rufi-breathe 4s ease-in-out infinite } .rufi .sign path, .rufi .sign circle { transform-box: fill-box; transform-origin: center } @keyframes rufi-z { 0% { opacity: 0; transform: translate(0, 10px) } 30%, 70% { opacity: 1 } 100% { opacity: 0; transform: translate(10px, -16px) } } @keyframes rufi-bob { 0%, 100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-10px) rotate(6deg) } } @keyframes rufi-dot { 0%, 60%, 100% { opacity: .4; transform: translateY(0) } 25% { opacity: 1; transform: translateY(-8px) } } @keyframes rufi-twinkle { 0%, 100% { opacity: .35; transform: scale(.7) rotate(0) } 50% { opacity: 1; transform: scale(1) rotate(20deg) } } @keyframes rufi-draw { 0%, 15% { stroke-dashoffset: 100 } 45%, 85% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0; opacity: 0 } } .rufi.m-sign .sign-z .z1 { animation: rufi-z 2.8s ease-out infinite } .rufi.m-sign .sign-z .z2 { animation: rufi-z 2.8s ease-out 1.1s infinite } .rufi.m-sign .sign-q { transform-box: fill-box; transform-origin: 50% 100%; animation: rufi-bob 2.4s ease-in-out infinite } .rufi.m-sign .sign-dots .d1 { animation: rufi-dot 1.4s ease-in-out infinite } .rufi.m-sign .sign-dots .d2 { animation: rufi-dot 1.4s ease-in-out .2s infinite } .rufi.m-sign .sign-dots .d3 { animation: rufi-dot 1.4s ease-in-out .4s infinite } .rufi.m-sign .sign-sparkle .s1 { animation: rufi-twinkle 2s ease-in-out infinite } .rufi.m-sign .sign-sparkle .s2 { animation: rufi-twinkle 2s ease-in-out .7s infinite } .rufi.m-sign .sign-check path { stroke-dasharray: 100; animation: rufi-draw 2.2s ease-out infinite } .rufi.m-hop .all { animation: rufi-hop 1.6s ease-in-out infinite } .rufi.m-tilt .all { animation: rufi-tilt 3.4s ease-in-out infinite } @media (prefers-reduced-motion: reduce) { .rufi * { animation: none !important } } </style><g class="all"><defs><clipPath id="r32c"><path d="M351.2 161.9A6.0 6.0 0 0 1 360.7 160.5L420.3 218.3A6.0 6.0 0 0 0 424.4 220.0L575.6 220.0A6.0 6.0 0 0 0 579.7 218.3L639.3 160.5A6.0 6.0 0 0 1 648.8 161.9L791.3 422.3A6.0 6.0 0 0 1 781.7 429.3L732.6 378.1A6.0 6.0 0 0 0 722.3 383.0L749.6 597.1A6.0 6.0 0 0 1 747.9 602.1L615.9 734.1A6.0 6.0 0 0 1 613.8 735.5L502.1 777.2A6.0 6.0 0 0 1 497.9 777.2L386.2 735.5A6.0 6.0 0 0 1 384.1 734.1L252.1 602.1A6.0 6.0 0 0 1 250.4 597.1L277.7 383.0A6.0 6.0 0 0 0 267.4 378.1L218.3 429.3A6.0 6.0 0 0 1 208.7 422.3Z"/></clipPath><clipPath id="r32l"><path d="M344.4 174.4A6.0 6.0 0 0 0 336.0 166.4L134.1 287.5A6.0 6.0 0 0 0 131.5 294.6L182.7 448.9A6.0 6.0 0 0 0 193.6 449.9Z"/></clipPath><clipPath id="r32r"><path d="M655.6 174.4A6.0 6.0 0 0 1 664.0 166.4L865.9 287.5A6.0 6.0 0 0 1 868.5 294.6L817.3 448.9A6.0 6.0 0 0 1 806.4 449.9Z"/></clipPath><linearGradient id="r32fl" gradientUnits="userSpaceOnUse" x1="130" y1="290" x2="271" y2="308"><stop offset="0" stop-color="#faf8f5"/><stop offset="1" stop-color="#ebe9e4"/></linearGradient><linearGradient id="r32fr" gradientUnits="userSpaceOnUse" x1="870" y1="290" x2="729" y2="308"><stop offset="0" stop-color="#f1efea"/><stop offset="1" stop-color="#dddcd7"/></linearGradient><linearGradient id="r32kl" gradientUnits="userSpaceOnUse" x1="271" y1="308" x2="331" y2="341"><stop offset="0" stop-color="#cf864f"/><stop offset="1" stop-color="#EE9A5B"/></linearGradient><linearGradient id="r32kr" gradientUnits="userSpaceOnUse" x1="729" y1="308" x2="66