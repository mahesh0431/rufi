packages:
  - apps/*
  - packages/*

# Supply chain: no dependency runs an install script unless it is listed in
# allowBuilds, and an unlisted one fails the install instead of being skipped.
strictDepBuilds: true
allowBuilds:
  # Its postinstall only sends install telemetry; it never runs.
  "@openuidev/lang-core": false

# The Claude Agent SDK drives the Claude installed on the Mac
# (pathToClaudeCodeExecutable), so the Claude binaries it bundles are never
# installed. Its peers serve only its in-process MCP server, which Rufi
# doesn't use; its main entry loads without them.
overrides:
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-darwin-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-darwin-x64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-arm64-musl": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-x64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-x64-musl": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-win32-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-win32-x64": "-"
  # OpenUI's chat state (react-headless 0.18.1) pins @ag-ui/core 0.0.53, which
  # asks for zod 3, and OpenUI's math in Markdown (react-ui) asks for katex
  # 0.16: both have advisories fixed only in later versions, Rufi's zod 4.6.7
  # and katex 0.18.
  "@ag-ui/core>zod": "4.6.7"
  katex: "0.18.11"

packageExtensions:
  "@anthropic-ai/claude-agent-sdk":
    peerDependenciesMeta:
      "@anthropic-ai/sdk":
        optional: true
      "@modelcontextprotocol/sdk":
        optional: true
      zod:
        optional: true
