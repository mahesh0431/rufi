name: check

# Every pull request, drafts too, and main after each merge. The jobs run side
# by side; `check` passes only when all of them do, so it is the one gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:quick
      # What Rufi ships. Dependabot's weekly updates cover the dev tools.
      - run: pnpm audit --prod

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Codex's sandbox (bwrap) needs user namespaces, which Ubuntu restricts.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @rufi/web build
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install chromium --with-deps
      # The Rufi app's tests: Electron's binary (it has no install script),
      # Chromium's sandbox (Ubuntu allows it only with user namespaces) and a
      # virtual display.
      - run: pnpm --filter @rufi/desktop exec install-electron
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @rufi/web build
      - run: xvfb-run --auto-servernum pnpm exec playwright test --shard=${{ matrix.shard }}/3

  # The gate branch protection asks for. It always runs, so it is never
  # skipped (a skipped required check counts as passed).
  check:
    if: always()
    needs: [quick, vitest, playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: gitleaks git --redact --no-banner
