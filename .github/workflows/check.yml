name: check

# Every pull request, drafts too, and main after each merge. The jobs run side
# by side; `check` passes only when all of them do, so it is the one gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:quick
      # Production dependencies only. Dev dependencies, Electron among them
      # (it runs the Rufi app), rely on Dependabot's weekly updates.
      - run: pnpm audit --prod

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Codex's sandbox (bwrap) needs user namespaces, which Ubuntu restricts.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @rufi/web build
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install chromium webkit --with-deps
      # The Rufi app's tests: Electron's binary (it has no install script),
      # Chromium's sandbox (Ubuntu allows it only with user namespaces) and a
      # virtual display that never resets. By default it resets when its last
      # app closes, and an app that opens just then can't reach it.
      # Electron's download is kept between runs, one per Electron version.
      - id: electron
        run: echo "version=$(pnpm --filter @rufi/desktop exec node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
      - run: pnpm --filter @rufi/desktop exec install-electron
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @rufi/web build
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -noreset" pnpm exec playwright test --shard=${{ matrix.shard }}/3

  # The tests that run only on a Mac and skip on Ubuntu: the AI's sandbox
  # canary on the pinned Codex, and the app icon.
  mac:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run apps/server/src/server/capture.test.ts apps/desktop/scripts/bundle-icon.test.ts

  # The iPhone app's Swift tests (apps/ios), on an iOS 27.0 Simulator with
  # Xcode 27.0, as on the Mac it is built on (the xcode-27 image has it).
  ios:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app && xcodebuild -version
      - run: xcodebuild test -project apps/ios/Rufi.xcodeproj -scheme Rufi -destination "platform=iOS Simulator,OS=27.0,name=iPhone 17" -resultBundlePath ios-tests.xcresult CODE_SIGNING_ALLOWED=NO
      # A failing test's issues, which the log of a parallel run leaves out.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-tests
          path: ios-tests.xcresult
      - run: xcodebuild build -project apps/ios/Rufi.xcodeproj -scheme "Rufi Seed" -destination "platform=iOS Simulator,OS=27.0,name=iPhone 17" CODE_SIGNING_ALLOWED=NO

  # The gate branch protection asks for. It always runs, so it is never
  # skipped (a skipped required check counts as passed).
  check:
    if: always()
    needs: [quick, vitest, playwright, mac, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: gitleaks git --redact --no-banner
